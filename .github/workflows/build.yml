# Сборка LabelMaker.exe для Windows.
# Запуск вручную: вкладка Actions → Build Windows exe → Run workflow (exe появится в Artifacts).
# Релиз: Releases → Draft a new release → тег vX.Y → Publish — exe и пример таблицы прикрепятся сами.
name: Build Windows exe

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name LabelMaker label_maker.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabelMaker
          path: dist/LabelMaker.exe

      - name: Publish release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LabelMaker.exe
            example.xlsx
